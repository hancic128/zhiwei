<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.6 8.6 24.8 21.2" role="img" aria-label="ZhiWei">
  <!--
    ZhiWei mark: only the "subtle observation" polyline itself (three strokes
    tapering from thick to thin, evoking "see the subtle, know the broad").
    No background plate, no stroke outline. The hard-coded cinnabar color
    here is only a fallback for "JS hasn't started running yet": the runtime
    applyFavicon() regenerates the same polyline in the current theme color
    (cinnabar / indigo / emerald / rose / amber / slate), so the tab icon
    always matches the sidebar logo color.
    When editing the polyline, update GLYPH in ui/src/components/ui/logo.tsx
    at the same time.
  -->
  <path d="M7 21.5h4.5l2.5-6 3 11 3-14.5 2.5 9.5H25"
        fill="none" stroke="#C73225" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
