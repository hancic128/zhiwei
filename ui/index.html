<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZhiWei · Console</title>
    <meta name="description" content="Know the subtle, await the right moment — ZhiWei multi-host observability" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Apply theme and color scheme on first frame to avoid flash (spec 03: persist prefs + first-frame restore).
      This script must run before any CSS / JS.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme") || "zhiwei";
          var scheme = localStorage.getItem("colorScheme");
          if (scheme !== "light" && scheme !== "dark") {
            scheme = window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          var locale = localStorage.getItem("locale");
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          if (scheme === "dark") root.classList.add("dark");
          if (locale) root.setAttribute("lang", locale);
        } catch (e) {
          /* localStorage unavailable — use defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
