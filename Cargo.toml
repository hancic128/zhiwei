[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/proto",
    "crates/storage",
    "crates/monitor-server",
    "crates/node-agent",
    "crates/ops-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/hancic128/zhiwei"

[workspace.dependencies]
# async
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# web
axum = { version = "0.7", features = ["http2", "macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "limit", "fs"] }
hyper = "1"

# protobuf
prost = "0.13"
prost-types = "0.13"

# storage
sqlx = { version = "0.8", features = [
    "sqlite",
    "runtime-tokio",
    "macros",
    "chrono",
    "uuid",
    "json",
] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# crypto
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "zeroize"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
x509-parser = "0.16"
time = "0.3"

# time / ids
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# errors
thiserror = "1"
anyhow = "1"

# cli
clap = { version = "4", features = ["derive", "env"] }

# config
config = { version = "0.14", default-features = false, features = ["toml"] }
toml = "0.8"

# misc
bytes = "1"
parking_lot = "0.12"
dashmap = "6"
walkdir = "2"
base64 = "0.22"
zeroize = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
