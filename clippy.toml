# Clippy lints
# https://rust-lang.github.io/rust-clippy/

msrv = "1.75"

# Function-arg count threshold for `too_many_arguments`.
too-many-arguments-threshold = 10

# `cognitive_complexity` / `too_many_lines` and `type_complexity` use their
# upstream defaults here; individual offenders are refactored or annotated in
# source rather than masked with a global threshold bump.
