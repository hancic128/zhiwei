name: release

# 打 tag（v0.1.0 这种）就出预编译二进制，供 scripts/install.sh 下载。
# 也支持手动触发，用来验证矩阵是否还能编过。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 上传 Release 资产需要

env:
  CARGO_TERM_COLOR: always

jobs:
  # 六个目标平台。Linux 三个用 cross（Docker 里带好交叉工具链），
  # macOS 两个用 GitHub 的原生 arm64 / x86_64 runner。
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 主流 VPS。musl 版本静态链接，不挑 glibc 版本，优先给用户装这个。
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # gnu 版本留给需要动态链接、或 musl 出问题的场景。
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # 本地开发 / 自建。
          # 两个 darwin 都在 macos-latest（Apple Silicon）上编：Apple 工具链
          # 原生就能交叉到 x86_64，不需要专门找 Intel runner——旧的 macos-13
          # 标签随时可能被 GitHub 退役，那样整条流水线会红。
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 用 stable 而不是仓库的 rust-version：这只是产出二进制，
      # 低版本兼容性由 Cargo.toml 的 1.75 声明保证，不必用老工具链编。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross 把交叉链接器、musl 工具链都封在镜像里，省得逐个装
      # gcc-aarch64-linux-gnu / musl-tools 还要跟 ring 的 C 代码较劲。
      - name: Install cross
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cross

      - name: Build (Linux, via cross)
        if: runner.os == 'Linux'
        run: cross build --release --target ${{ matrix.target }} --bin zhiwei-node --bin zhiwei-monitor

      - name: Build (macOS, native)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }} --bin zhiwei-node --bin zhiwei-monitor

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="manual-${GITHUB_SHA::7}"
          dir="target/${{ matrix.target }}/release"

          # 资产名**不带版本号**：install.sh 要用
          # releases/latest/download/<固定名字> 这条稳定路径。
          asset="zhiwei-${{ matrix.target }}"
          staging="$(mktemp -d)"
          cp "$dir/zhiwei-node" "$staging/"
          cp "$dir/zhiwei-monitor" "$staging/"
          # 分开 copy 并逐个判存在：`cp README.md LICENSE dest/` 在 LICENSE
          # 缺失时会整条失败，可能连 README 都拷不进去（各平台 cp 行为不一致）。
          # 本仓库当前没有 LICENSE 文件，所以这条路径是常态而非异常。
          for f in README.md LICENSE NOTICE; do
            if [ -f "$f" ]; then cp "$f" "$staging/"; fi
          done
          printf '%s\n' "$version" > "$staging/VERSION"

          tar -C "$staging" -czf "$asset.tar.gz" .
          sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256" 2>/dev/null \
            || shasum -a 256 "$asset.tar.gz" > "$asset.tar.gz.sha256"

          echo "打包完成："
          ls -lh "$asset.tar.gz" "$asset.tar.gz.sha256"

      # tag 推送才发布；手动触发只跑构建，确认矩阵没坏。
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zhiwei-${{ matrix.target }}.tar.gz
            zhiwei-${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true

      # 同步 release 资产 + scripts 到腾讯云 COS，国内服务器脚本可稳定拉取。
      # hancic-public-artifacts 仓库持 COS 凭证，本仓库零 secret。
      - name: Mirror release assets to COS
        if: startsWith(github.ref, 'refs/tags/v')
        uses: hancic128/hancic-public-artifacts/.github/workflows/oss-release.yml@main
        with:
          bucket: public-artifacts-1310342032
          region: ap-nanjing
          key_prefix: hancic128/zhiwei
          file_pattern: 'zhiwei-*.tar.gz zhiwei-*.tar.gz.sha256'
          extra_paths: 'scripts'

      - name: Upload artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: zhiwei-${{ matrix.target }}
          path: |
            zhiwei-${{ matrix.target }}.tar.gz
            zhiwei-${{ matrix.target }}.tar.gz.sha256
