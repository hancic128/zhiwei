name: release

# 打 tag（v0.1.0 这种）就出预编译二进制，供 scripts/install.sh 下载。
# 也支持手动触发，用来验证矩阵是否还能编过。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 上传 Release 资产需要

env:
  CARGO_TERM_COLOR: always

jobs:
  # 六个目标平台。Linux 三个用 cross（Docker 里带好交叉工具链），
  # macOS 两个用 GitHub 的原生 arm64 / x86_64 runner。
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 主流 VPS。musl 版本静态链接，不挑 glibc 版本，优先给用户装这个。
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # gnu 版本留给需要动态链接、或 musl 出问题的场景。
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # 本地开发 / 自建。
          # 两个 darwin 都在 macos-latest（Apple Silicon）上编：Apple 工具链
          # 原生就能交叉到 x86_64，不需要专门找 Intel runner——旧的 macos-13
          # 标签随时可能被 GitHub 退役，那样整条流水线会红。
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 用 stable 而不是仓库的 rust-version：这只是产出二进制，
      # 低版本兼容性由 Cargo.toml 的 1.75 声明保证，不必用老工具链编。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross 把交叉链接器、musl 工具链都封在镜像里，省得逐个装
      # gcc-aarch64-linux-gnu / musl-tools 还要跟 ring 的 C 代码较劲。
      - name: Install cross
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cross

      - name: Build (Linux, via cross)
        if: runner.os == 'Linux'
        run: cross build --release --target ${{ matrix.target }} --bin zhiwei-node --bin zhiwei-monitor

      - name: Build (macOS, native)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }} --bin zhiwei-node --bin zhiwei-monitor

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="manual-${GITHUB_SHA::7}"
          dir="target/${{ matrix.target }}/release"

          # 资产名**不带版本号**：install.sh 要用
          # releases/latest/download/<固定名字> 这条稳定路径。
          asset="zhiwei-${{ matrix.target }}"
          staging="$(mktemp -d)"
          cp "$dir/zhiwei-node" "$staging/"
          cp "$dir/zhiwei-monitor" "$staging/"
          # 分开 copy 并逐个判存在：`cp README.md LICENSE dest/` 在 LICENSE
          # 缺失时会整条失败，可能连 README 都拷不进去（各平台 cp 行为不一致）。
          # 本仓库当前没有 LICENSE 文件，所以这条路径是常态而非异常。
          for f in README.md LICENSE NOTICE; do
            if [ -f "$f" ]; then cp "$f" "$staging/"; fi
          done
          printf '%s\n' "$version" > "$staging/VERSION"

          tar -C "$staging" -czf "$asset.tar.gz" .
          sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256" 2>/dev/null \
            || shasum -a 256 "$asset.tar.gz" > "$asset.tar.gz.sha256"

          echo "打包完成："
          ls -lh "$asset.tar.gz" "$asset.tar.gz.sha256"

      # tag 推送才发布；手动触发只跑构建，确认矩阵没坏。
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zhiwei-${{ matrix.target }}.tar.gz
            zhiwei-${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true

      # 把二进制传给 mirror job（reusable workflow）— GitHub 限制 reusable
      # workflow 只能在顶级 jobs.*.uses 引用，所以拆成独立 job + artifact 传递。
      - name: Upload artifacts for COS mirror
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            zhiwei-${{ matrix.target }}.tar.gz
            zhiwei-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: zhiwei-${{ matrix.target }}
          path: |
            zhiwei-${{ matrix.target }}.tar.gz
            zhiwei-${{ matrix.target }}.tar.gz.sha256

  # 同步 release 资产 + scripts 到阿里云 OSS，国内服务器脚本可稳定拉取。
  # 注：
  #   1. 公开仓库之间 GitHub 不让 reusable workflow 传 secret，所以本仓库直接跑
  #   2. 腾讯云 COS 在本环境实测 10 KB/s（6MB 文件 6 分钟），不可用；阿里云 OSS 正常
  # 本仓库配 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 两个 secret。
  mirror:
    name: Mirror release assets to OSS
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: ./_artifacts
          merge-multiple: true

      - name: Flatten artifacts to repo root
        run: |
          find ./_artifacts -type f -exec mv -t . {} +
          rm -rf ./_artifacts
          ls -la *.tar.gz *.sha256 2>/dev/null | head -20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install oss2
        run: pip install oss2

      - name: Upload artifacts to OSS
        env:
          OSS_ENDPOINT:          https://oss-cn-beijing.aliyuncs.com
          OSS_BUCKET:            hancic-public-artifacts
          OSS_KEY_PREFIX:        hancic128/zhiwei
          OSS_FILE_PATTERN:      'zhiwei-*.tar.gz zhiwei-*.tar.gz.sha256'
          OSS_EXTRA_PATHS:       scripts
          OSS_VERSION_TAG:       ${{ github.ref_name }}
          OSS_INCLUDE_LATEST:    'true'
          OSS_MAKE_PUBLIC:       'true'
          OSS_ACCESS_KEY_ID:     ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: python .github/scripts/upload.py

      # 再同步一份到 bj 制品仓库（自建 nginx WebDAV，国内直连）。
      # 目录形状与 OSS 一致：<prefix>/v<tag>/<file> + <prefix>/latest/<file>，
      # 所以用户只要换 ZHIWEI_BASE_URL 就能切到自建源：
      #   ZHIWEI_BASE_URL=http://49.232.168.161:8888/releases/hancic128/zhiwei
      # 先 PUT 到 /upload/ 暂存、再 MOVE 到 /releases/：制品目录里只会出现
      # 完整传完的文件。
      - name: Upload to bj artifacts
        env:
          HOST: ${{ secrets.ARTIFACTS_HOST }}
          USER: ${{ secrets.ARTIFACTS_USER }}
          PASS: ${{ secrets.ARTIFACTS_PASS }}
        run: |
          set -euo pipefail
          prefix="hancic128/zhiwei"
          tag="${GITHUB_REF_NAME}"

          # 写配额 30r/m（burst 20），一次发版 20–40 次写请求，偶尔会撞 429。
          # 这里自己退避重试，不用 curl 的 --retry-all-errors —— 那个选项要
          # curl ≥ 7.71，老机器上直接报 unknown option。
          call() {
            local attempt code
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -u "$USER:$PASS" "$@" || echo 000)
              case "$code" in
                2*) return 0 ;;
                429|5*)
                  echo "  [第 $attempt 次] HTTP $code，等 $((attempt * 3))s 重试" >&2
                  sleep $((attempt * 3)) ;;
                *)
                  echo "  HTTP $code（不重试）：$*" >&2
                  return 1 ;;
              esac
            done
            echo "  重试 5 次仍失败：$*" >&2
            return 1
          }

          mapfile -t files < <(ls zhiwei-*.tar.gz zhiwei-*.tar.gz.sha256)
          mapfile -t scripts < <(find scripts -maxdepth 1 -type f | sort)
          echo "待同步：${#files[@]} 个制品 + ${#scripts[@]} 个脚本"

          for stage in "$tag" latest; do
            for f in "${files[@]}" "${scripts[@]}"; do
              target="$prefix/$stage/$f"
              call -T "$f" "http://$HOST/upload/$target"
              call -X MOVE \
                -H "Destination: http://$HOST/releases/$target" \
                -H "Overwrite: T" \
                "http://$HOST/upload/$target"
            done
          done

          echo "已同步 → http://$HOST/releases/$prefix/latest/"
          echo -n "抽查 latest/ 制品："
          call "http://$HOST/releases/$prefix/latest/$(basename "${files[0]}")" && echo ok
