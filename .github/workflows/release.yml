name: release

# Tag push (v0.0.1 etc.) produces prebuilt binaries for scripts/install.sh to download.
# Also supports manual dispatch to verify the build matrix still works.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # required to upload Release assets

env:
  CARGO_TERM_COLOR: always

jobs:
  # Six target platforms. Three Linux variants use cross (Docker images with the cross toolchains).
  # Two macOS variants use GitHub-hosted native arm64 / x86_64 runners.
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mainstream VPS. musl variants are statically linked and don't depend on a specific glibc version — preferred for users.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # gnu variants are kept for cases that need dynamic linking, or where musl fails.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # Local development / self-hosted.
          # Both darwin builds run on macos-latest (Apple Silicon): Apple's toolchain
          # cross-compiles to x86_64 natively, so we don't need a dedicated Intel runner —
          # the old macos-13 label can be retired by GitHub at any time, which would break
          # the pipeline.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Use stable rather than the repo's rust-version: this job only produces binaries.
      # Low-version compatibility is guaranteed by Cargo.toml's 1.75 declaration, so we
      # don't need to compile with an older toolchain.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross ships the cross-linker and musl toolchain inside a Docker image, sparing us
      # from installing gcc-aarch64-linux-gnu / musl-tools and wrestling with ring's C code.
      - name: Install cross
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cross

      - name: Build (Linux, via cross)
        if: runner.os == 'Linux'
        run: cross build --release --target ${{ matrix.target }} --bin zhiwei-node --bin zhiwei-monitor --bin zhiwei-ops

      - name: Build (macOS, native)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }} --bin zhiwei-node --bin zhiwei-monitor --bin zhiwei-ops

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="manual-${GITHUB_SHA::7}"
          dir="target/${{ matrix.target }}/release"

          # Asset name has **no version suffix**: install.sh uses the stable
          # releases/latest/download/<fixed-name> path.
          asset="zhiwei-${{ matrix.target }}"
          staging="$(mktemp -d)"
          cp "$dir/zhiwei-node" "$staging/"
          cp "$dir/zhiwei-monitor" "$staging/"
          # ops-server (control plane) must be packaged together: the command channel
          # (delete container / fetch logs / restart host) needs it to sign commands.
          # A deployment shipping only monitor would keep reporting
          # "ops-server unavailable: Connection refused".
          cp "$dir/zhiwei-ops" "$staging/"
          # Copy files individually and check existence: `cp README.md LICENSE dest/`
          # fails wholesale if LICENSE is missing, which can prevent README from being
          # copied at all (cp behavior varies across platforms).
          for f in README.md LICENSE NOTICE; do
            if [ -f "$f" ]; then cp "$f" "$staging/"; fi
          done
          printf '%s\n' "$version" > "$staging/VERSION"

          tar -C "$staging" -czf "$asset.tar.gz" .
          sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256" 2>/dev/null \
            || shasum -a 256 "$asset.tar.gz" > "$asset.tar.gz.sha256"

          echo "Packaging complete:"
          ls -lh "$asset.tar.gz" "$asset.tar.gz.sha256"

      # Only publish on tag push; manual dispatch only runs the build to confirm the matrix isn't broken.
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zhiwei-${{ matrix.target }}.tar.gz
            zhiwei-${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true

      # Publish to GitHub Packages (hancic128-artifacts)
      - name: Push to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: zhiwei-${{ matrix.target }}
          path: |
            zhiwei-${{ matrix.target }}.tar.gz
            zhiwei-${{ matrix.target }}.tar.gz.sha256
          retention-days: 30

      # Upload to hancic-artifacts releases/hancic128/zhiwei/ (国内加速)
      - name: Upload to hancic-artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOST: ${{ secrets.ARTIFACTS_HOST }}
          USER: ${{ secrets.ARTIFACTS_USER }}
          PASS: ${{ secrets.ARTIFACTS_PASS }}
        run: |
          set -eu
          f="zhiwei-${{ matrix.target }}.tar.gz"
          # 上传到版本目录
          curl -fsS -u "$USER:$PASS" -T "$f" \
            "https://${HOST}/releases/hancic128/zhiwei/${GITHUB_REF_NAME#v}/${f}"
          # 同时上传到 latest 目录
          curl -fsS -u "$USER:$PASS" -T "$f" \
            "https://${HOST}/releases/hancic128/zhiwei/latest/${f}"
          echo "Uploaded to artifacts.hancic.site/releases/hancic128/zhiwei/${GITHUB_REF_NAME#v}/${f} and latest/"

      # Upload install.sh to hancic-artifacts public/ (国内可访问)
      # Only run once, not on every matrix job (install.sh is identical across platforms)
      - name: Upload install.sh to artifacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.target == 'x86_64-unknown-linux-musl'
        env:
          HOST: ${{ secrets.ARTIFACTS_HOST }}
          USER: ${{ secrets.ARTIFACTS_USER }}
          PASS: ${{ secrets.ARTIFACTS_PASS }}
        run: |
          set -eu
          # 安装脚本直接 PUT 到 public 目录（匿名可读）
          curl -fsS -u "$USER:$PASS" -T scripts/install.sh \
            "https://${HOST}/public/install.sh"
          echo "Uploaded install.sh to artifacts.hancic.site/public/install.sh"

