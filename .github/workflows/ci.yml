name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.job }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: fmt
            command: cargo fmt --check
          - job: clippy
            command: cargo clippy --all-targets -- -D warnings
          - job: test
            command: cargo test --all-targets

    steps:
      - uses: actions/checkout@v4

      # Pinned deliberately. clippy and rustfmt gain lints between releases, so
      # `@stable` drifts ahead of the dev toolchain and turns unrelated PRs red.
      # Bump this together with a formatting/lint cleanup pass.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: ${{ matrix.job }}
        run: ${{ matrix.command }}

  deny:
    name: Rust (deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      # `npm run build` runs the locale key-count check, tsc, and vite build.
      - name: Build
        working-directory: ui
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: zhiwei:test
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # Aggregate status: every job must pass. Branch protection on `main`
  # requires a check named exactly `CI/checks`, so this job carries that name.
  success:
    name: CI/checks
    needs: [rust, deny, ui, docker]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI checks passed!"
