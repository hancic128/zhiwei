syntax = "proto3";

package zhiwei.telemetry.v1;

import "common.proto";

message Metric {
  string name = 1;            // e.g. "cpu.usage", "mem.used"
  double value = 2;
  map<string, string> labels = 3;
}

message Container {
  string id = 1;
  string name = 2;
  string image = 3;
  string state = 4;              // running / exited / paused / created / restarting
  // Field 5 was historically the start time; now started_at_unix_nano below
  reserved 5;
  int64 created_at_unix_nano = 6;
  string status = 7;             // human-readable, e.g. "Up 3 days (healthy)"
  string runtime = 8;            // "docker"
  // Filled by per-container inspect (not returned by the list endpoint):
  // the UI needs both uptime and "last updated".
  int64 started_at_unix_nano = 9;   // 0 = unknown / never started
  int64 finished_at_unix_nano = 10; // 0 = unknown / still running
  // Compose labels (empty string for containers not started by compose).
  // The "application" dimension is derived from these automatically; users
  // do not have to build a hierarchy by hand.
  string compose_project = 11;      // com.docker.compose.project
  string compose_service = 12;      // com.docker.compose.service
  // Usage and limits: one sample from /containers/{id}/stats plus
  // HostConfig from inspect. Only populated for running containers; when
  // unavailable the field stays 0 and the UI renders "—" instead of lying.
  uint64 mem_usage_bytes = 13;      // resident memory minus page cache
  uint64 mem_limit_bytes = 14;      // HostConfig.Memory; 0 = unlimited
  double cpu_percent = 15;          // share of all cores on this host (same scale as the process list)
  uint64 cpu_limit_nano = 16;       // HostConfig.NanoCpus; 0 = unlimited
}

message ProcessInfo {
  int32 pid = 1;
  string name = 2;
  string cmdline = 3;
  string user = 4;
  double cpu_percent = 5;
  uint64 memory_bytes = 6;
}

message ProcessSnapshot {
  repeated ProcessInfo processes = 1;
}

message NetworkInterface {
  string name = 1;
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;
  uint64 rx_packets = 4;
  uint64 tx_packets = 5;
}

message DiskMount {
  string mountpoint = 1;
  string filesystem = 2;
  uint64 total_bytes = 3;
  uint64 used_bytes = 4;
}

message CertInfo {
  string path = 1;
  string subject = 2;              // subject CN
  string issuer = 3;               // issuer CN
  int64 not_after_unix_nano = 4;   // expiration timestamp
  int64 not_before_unix_nano = 5;
  repeated string domains = 6;     // DNS names from the SAN
  string serial = 7;
  bool parse_error = 8;            // set when parsing fails; path is still reported
  string source_id = 9;            // matched server-side certificate source id; empty for built-in / CLI globs
}

// Basic host info. Most fields are static; IPs may change, so every batch
// carries them and the server keeps only the latest.
message IpAddress {
  string addr = 1;      // "192.168.1.5"
  uint32 prefix = 2;    // 24
}

message InterfaceInfo {
  string name = 1;
  repeated IpAddress addresses = 2;
  bool loopback = 3;
}

message HostInfo {
  string hostname = 1;
  string os_name = 2;              // "macOS" / "Ubuntu" / "Debian GNU/Linux"
  string os_version = 3;           // "15.0"
  string long_os_version = 4;      // "MacOS 15.0.1 Sequoia"
  string kernel_version = 5;
  string arch = 6;                 // "aarch64" / "x86_64"
  string cpu_brand = 7;
  uint32 cpu_cores = 8;
  uint64 total_memory_bytes = 9;
  uint64 uptime_seconds = 10;
  uint64 boot_time_unix_seconds = 11;
  repeated InterfaceInfo interfaces = 12;
  string agent_version = 13;
  // Unix seconds at which the current node-agent process booted. The console
  // uses this to render "deployed at". Older agents do not set this field
  // (default 0); the UI treats that as unknown and hides the value.
  uint64 agent_started_at_unix_seconds = 14;
}

// Time-series data: reported every interval seconds; history is retained.
// Snapshot data (host info / containers / processes) goes through
// InventoryReport and is not in this message, otherwise every 30-second
// repeat would also re-send static data and storage would explode.
message TelemetryBatch {
  string node_id = 1;
  int64 ts_unix_nano = 2;
  int32 interval_seconds = 3;
  repeated Metric metrics = 4;
  repeated NetworkInterface network = 8;
  repeated DiskMount disks = 9;
  bytes signature = 10;                  // ed25519 signature over the whole batch with signature blanked
}

// Snapshot data: reported at low frequency (default every 5 minutes or when
// content changes); the server only retains the latest copy.
message InventoryReport {
  string node_id = 1;
  int64 ts_unix_nano = 2;
  HostInfo host_info = 3;
  repeated Container containers = 4;
  ProcessSnapshot processes = 5;
  bytes signature = 6;                   // node private key signing the report with signature blanked
  repeated CertInfo certificates = 7;    // certificates discoverable on the host (sent alongside snapshots)
}