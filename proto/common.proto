syntax = "proto3";

package zhiwei.common.v1;

// Common base types.

// Node ID — assigned by monitor on first enroll and persisted by the node.
message NodeId {
  string value = 1;
}

// Hostname — captured at node startup.
message Hostname {
  string value = 1;
}

// Key/value label (e.g. role=web / env=prod).
message Label {
  string key = 1;
  string value = 2;
}

// Time range (unix nanos).
message TimeRange {
  int64 start_unix_nano = 1;
  int64 end_unix_nano = 2;
}

// Ed25519 signature (64 bytes).
message Signature {
  bytes value = 1;
}

// Ed25519 public key (32 bytes).
message PublicKey {
  bytes value = 1;
}

// Enroll request: node submits its Ed25519 public key + metadata.
// We no longer take a CSR — node identity moved from "X.509 certificate" to
// "signing key" because managed platforms terminate TLS at the edge and do not
// forward client certificates.
message EnrollRequest {
  reserved 1;                     // formerly csr_pem (PKCS#10 CSR)
  string hostname = 2;
  repeated Label labels = 3;
  // Node Ed25519 public key (32 bytes). All subsequent requests are signed
  // with the matching private key.
  bytes public_key = 4;
  // Optional: carried by the node at enroll time
  // (`zhiwei-node --alias` / `install-node.sh --alias`) so the operator
  // does not have to fill in aliases for every machine. Admins can still
  // edit them in the console afterwards.
  string alias = 5;
  repeated string tags = 6;
}

// Enroll response: monitor registers the public key and returns identifiers.
message EnrollResponse {
  string node_id = 1;
  reserved 2;                     // formerly client_cert_pem (no longer issued)
  // Monitor CA certificate. Used for pinning on self-hosted deployments
  // where the monitor terminates TLS itself; on edge-terminated PaaS
  // deployments the server cert is provided by the platform and this
  // field can be ignored.
  string ca_cert_pem = 3;
  string monitor_cert_pem = 4;
  // Ops control-plane public key (base64). The node persists this on first
  // enroll and uses it to verify command signatures — TOFU. Even if monitor
  // is later compromised, it cannot forge commands without ops's key.
  string ops_public_key = 5;
}