syntax = "proto3";

package zhiwei.control.v1;

// Control-plane actions. Nodes decide whether to execute based on a
// per-node capability set (introduced in P2-3).
enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_NOOP = 1;          // connectivity self-check
  ACTION_FETCH_LOGS = 2;    // on-demand log pull (container or file)
  ACTION_KILL_PROCESS = 3;  // kill a process (params: KillProcessParams)
  ACTION_RESTART_HOST = 4;  // restart the host (no params)
  ACTION_SHUTDOWN_HOST = 5; // shut down the host (no params)
  ACTION_CONTAINER_START = 6;    // start a container (params: ContainerActionParams)
  ACTION_CONTAINER_STOP = 7;     // stop a container (params: ContainerActionParams)
  ACTION_CONTAINER_RESTART = 8;  // restart a container (params: ContainerActionParams)
  ACTION_REFRESH_INVENTORY = 9;  // force an immediate inventory snapshot (no params)
  ACTION_SCAN_CERTS = 10;        // scan certificates under a path (params: ScanCertsParams)
  ACTION_CONTAINER_REMOVE = 11;  // remove a container (params: ContainerActionParams, force defaults to false)
  ACTION_UPGRADE_AGENT = 12;     // upgrade node-agent binary (params: UpgradeAgentParams)
}

// Commands are signed by ops-server's private key; nodes verify them with
// the ops public key they obtained at enroll. Therefore a compromised monitor
// cannot forge commands (the rationale for splitting ops and monitor per
// design doc D7).
message Command {
  string id = 1;                    // uuid
  string node_id = 2;
  Action action = 3;
  string params_json = 4;           // action params (e.g. FetchLogsParams as JSON)
  bytes nonce = 5;                  // 16 bytes, anti-replay
  int64 issued_at_unix_nano = 6;
  int64 ttl_seconds = 7;
  bytes signature = 8;              // ops private key signing the message with signature blanked
}

// Receipt from the node, signed by the node's private key so it cannot be
// tampered with in transit.
message CommandResult {
  string command_id = 1;
  string node_id = 2;
  bool ok = 3;
  string error = 4;
  bytes payload = 5;                // action output (e.g. UTF-8 log bytes)
  int64 finished_at_unix_nano = 6;
  bytes signature = 7;
}

// ACTION_FETCH_LOGS params.
message FetchLogsParams {
  // container | file
  string source = 1;
  string container = 2;             // container name or ID (when source=container)
  string path = 3;                  // file path (when source=file)
  uint32 tail = 4;                  // number of trailing lines to fetch
  bool timestamps = 5;              // include timestamps in container logs
}

// ACTION_KILL_PROCESS params.
//
// Only two signals are allowed: `term` for graceful exit (SIGTERM, the process
// can clean up), `kill` for forced exit (SIGKILL, the process cannot trap).
// Arbitrary signal names are rejected so this channel cannot be turned into a
// generic signal-injection entrypoint.
message KillProcessParams {
  int32 pid = 1;
  string signal = 2;                // term | kill
}

// ACTION_CONTAINER_* params.
message ContainerActionParams {
  string container = 1;             // container name or ID (Docker accepts both)
}

// ACTION_SCAN_CERTS params.
//
// Exactly one path: either a directory (auto-expanded to common certificate
// extensions), a single PEM file, or a glob. Scan results are placed in the
// receipt payload as JSON so the console "test" button can render them.
message ScanCertsParams {
  string path = 1;
}

// ACTION_UPGRADE_AGENT params.
//
// Upgrades the node-agent binary. The agent downloads the new binary,
// verifies its SHA256 checksum, backs up the current version, replaces it,
// and optionally restarts.
message UpgradeAgentParams {
  string version = 1;            // target version (e.g. "v1.2.3")
  string download_url = 2;       // URL to download the binary from
  string sha256 = 3;             // SHA256 checksum of the binary
  bool restart = 4;              // whether to restart after upgrade (default true)
}