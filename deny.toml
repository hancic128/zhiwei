[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # Rust crates
    "Apache-2.0 WITH LLVM-exception",  # for spin, llvm-sys
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
version = 2
yanked = "warn"
# Only report unmaintained crates we depend on directly, not the whole tree.
unmaintained = "workspace"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
